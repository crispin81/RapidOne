name: release

# Kept for later: releases are built and tested on each platform by hand for now
# (Linux: scripts/build-linux-release.sh). Run by hand from the Actions tab; it
# builds the installers into a draft GitHub release, published once checked.
# Note: the repo holds private/ — never build a public release from it while it's there.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v1.0.0'
        required: true

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon only: RapidRetouch's engine (PyTorch) has no Intel Mac builds.
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            args: '--target aarch64-apple-darwin'
          # The oldest supported Ubuntu, so the AppImage runs on newer distros too (glibc).
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            args: ''
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential rpm

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: install frontend dependencies
        run: npm install

      # The Edit models go inside the installer (tauri.release.conf.json).
      - name: fetch AI models
        run: npm run fetch-models

      # uv and RapidRetouch's engine source (it sets itself up on first launch).
      - name: stage release files
        shell: bash
        run: scripts/prepare-release.sh ${{ matrix.target }}

      - name: install patched linuxdeploy gtk hook (native Wayland, dark, safe drawing)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          mkdir -p ~/.cache/tauri
          cp .github/appimage/linuxdeploy-plugin-gtk.sh ~/.cache/tauri/linuxdeploy-plugin-gtk.sh
          chmod +x ~/.cache/tauri/linuxdeploy-plugin-gtk.sh

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag }}
          releaseName: 'RapidOne ${{ inputs.tag }}'
          releaseBody: 'See the README for install instructions. The Retouch tab downloads its AI engine the first time it opens (about 1–3 GB, once).'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json
